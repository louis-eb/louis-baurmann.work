        /* ============================================
           RESET & BASE STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Roboto Mono', 'Courier New', monospace;
            background: #F5EEDC;
            color: #000000;
            cursor: none; /* Hide default cursor */
            overflow-x: hidden;
        }

        /* ============================================
           CUSTOM CURSOR WITH INVERT EFFECT
           ============================================ */
        .cursor {
            width: 60px;
            height: 60px;
            border: 2px solid #000;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease, border-width 0.3s ease;
            mix-blend-mode: difference; /* Color inversion effect */
            background: #fff; /* White for difference blend */
        }

        /* Cursor hover state - expand */
        .cursor.hover {
            width: 80px;
            height: 80px;
            border-width: 3px;
        }

/* ============================================

        /* ============================================
           MASONRY GRID LAYOUT
           ============================================ */
        .masonry-grid {
            column-count: 3;
            column-gap: 2rem;
        }

        .grid-item {
            break-inside: avoid;
            margin-bottom: 2rem;
            cursor: none;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInItem 0.6s ease forwards;
        }

        @keyframes fadeInItem {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .grid-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .grid-item:hover img {
            transform: scale(1.02);
            filter: brightness(0.95);
        }

        .grid-item figcaption {
            font-size: 0.85rem;
            margin-top: 0.5rem;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        /* ============================================
           PROJECT MODAL / PAGE
           ============================================ */
        .project-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #F5EEDC;
            z-index: 2000;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .project-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .project-content {
            padding: 120px 3rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .project-header {
            margin-bottom: 3rem;
        }

        .project-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 3rem;
            font-weight: 500;
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
        }

        .project-meta {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1rem;
        }

        .project-description {
            font-size: 1rem;
            line-height: 1.8;
            max-width: 700px;
            margin-bottom: 3rem;
        }

        .project-images {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .project-images img {
            width: 100%;
            height: auto;
        }

        .close-project {
            position: fixed;
            top: 2rem;
            right: 3rem;
            font-size: 2rem;
            background: none;
            border: none;
            cursor: none;
            z-index: 2001;
            font-family: 'Roboto Mono', monospace;
            color: #000;
            transition: opacity 0.3s ease;
        }

        .close-project:hover {
            opacity: 0.6;
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 1024px) {
            .masonry-grid {
                column-count: 2;
            }
        }

        @media (max-width: 768px) {
            body {
                cursor: auto;
            }

            .cursor,
            .cursor-trail {
                display: none;
            }

            .masonry-grid {
                column-count: 1;
            }

            header {
                padding: 1.5rem 2rem;
            }

            main,
            .project-content {
                padding-left: 2rem;
                padding-right: 2rem;
            }

            .project-title {
                font-size: 2rem;
            }

            .close-project {
                right: 2rem;
            }
        }

        /* ============================================
           LOADING ANIMATION
           ============================================ */
        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 0.9rem;
            opacity: 0.5;
        }

<body>
    <!-- Custom Cursor Elements -->
    <div class="cursor"></div>
    <div class="cursor-trail"></div>

    <!-- Header / Navigation -->
    <header>
        <a href="#" class="logo" id="home-link">Louis Baurmann</a>
        <div class="header-right">

                <svg class="instagram-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <!-- Main Content - Masonry Grid -->
    <main id="main-content">
        <div class="masonry-grid" id="grid">

        </div>
        <div class="loading" id="loading">Loading more projects...</div>
    </main>

    <!-- Project Modal -->
    <div class="project-modal" id="project-modal">
        <button class="close-project" id="close-modal">×</button>
        <div class="project-content" id="modal-content">
            <!-- Project details will be loaded here -->
        </div>
    </div>

    <script>
        // ============================================

        const projects = [

                    "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1200",
                    "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=1200"
                ]
            },
            {
                id: 2,

                location: "Berlin",

                thumbnail: "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?w=600",
                images: [
                    "https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?w=1200",
                    "https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=1200"
                ]
            },
            {
                id: 3,
                title: "Garden House",
                year: "2024",
                location: "Hamburg",
                description: "Ein Pavillon, der Innen- und Außenräume nahtlos miteinander verbindet.",
                thumbnail: "https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=600",
                images: [
                    "https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=1200",
                    "https://images.unsplash.com/photo-1600585154526-990dced4db0d?w=1200"
                ]
            },
            {
                id: 4,
                title: "Stadthaus am Park",
                year: "2023",
                location: "Köln",
                description: "Urbanes Wohnen mit direktem Zugang zum Grünen.",
                thumbnail: "https://images.unsplash.com/photo-1600047509358-9dc75507daeb?w=600",
                images: [
                    "https://images.unsplash.com/photo-1600047509358-9dc75507daeb?w=1200"
                ]
            },
            {
                id: 5,
                title: "Atelier Workspace",
                year: "2024",
                location: "Frankfurt",
                description: "Kreative Arbeitsflächen mit flexibler Raumgestaltung.",
                thumbnail: "https://images.unsplash.com/photo-1600585154084-4e5fe7c39198?w=600",
                images: [
                    "https://images.unsplash.com/photo-1600585154084-4e5fe7c39198?w=1200",
                    "https://images.unsplash.com/photo-1600607687644-c7171b42498b?w=1200"
                ]
            },
            {
                id: 6,
                title: "Penthouse Suite",
                year: "2023",
                location: "Stuttgart",
                description: "Luxuriöses Wohnen auf höchstem Niveau.",
                thumbnail: "https://images.unsplash.com/photo-1600566752355-35792bedcfea?w=600",
                images: [

                ]
            },
            {
                id: 7,
                title: "Riverside Residence",
                year: "2024",
                location: "Düsseldorf",
                description: "Wohnen am Wasser mit spektakulärem Ausblick.",
                thumbnail: "https://images.unsplash.com/photo-1600573472591-ee6b68d14c68?w=600",
                images: [
                    "https://images.unsplash.com/photo-1600573472591-ee6b68d14c68?w=1200"
                ]
            },
            {
                id: 8,
                title: "Studio Komplex",
                year: "2023",
                location: "Leipzig",
                description: "Modulares Raumkonzept für kreatives Arbeiten.",
                thumbnail: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=600",
                images: [
                    "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1200"
                ]
            }
        ];

        // ============================================
        // CUSTOM CURSOR LOGIC
        // ============================================
        const cursor = document.querySelector('.cursor');
        const cursorTrail = document.querySelector('.cursor-trail');
        let mouseX = 0, mouseY = 0;
        let trailX = 0, trailY = 0;

        // Update cursor position on mouse move
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
        });

        // Smooth trailing cursor animation
        function animateTrail() {
            trailX += (mouseX - trailX) * 0.15;
            trailY += (mouseY - trailY) * 0.15;
            
            cursorTrail.style.left = trailX + 'px';
            cursorTrail.style.top = trailY + 'px';
            
            requestAnimationFrame(animateTrail);
        }
        animateTrail();

        // Cursor hover effects
        const hoverElements = document.querySelectorAll('a, .grid-item, button');
        function addCursorHover() {
            document.querySelectorAll('a, .grid-item, button').forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
            });
        }

        // ============================================
        // RENDER PROJECTS
        // ============================================
        const grid = document.getElementById('grid');
        let loadedProjects = 0;
        const projectsPerLoad = 8;

        function renderProjects() {
            const projectsToLoad = projects.slice(loadedProjects, loadedProjects + projectsPerLoad);
            
            projectsToLoad.forEach((project, index) => {
                const figure = document.createElement('figure');
                figure.className = 'grid-item';
                figure.style.animationDelay = `${index * 0.1}s`;
                figure.innerHTML = `
                    <img src="${project.thumbnail}" alt="${project.title}" loading="lazy">
                    <figcaption>${project.title}</figcaption>
                `;
                
                figure.addEventListener('click', () => openProject(project.id));
                grid.appendChild(figure);
            });
            
            loadedProjects += projectsToLoad.length;
            
            if (loadedProjects >= projects.length) {
                document.getElementById('loading').style.display = 'none';
            }
            
            // Re-attach hover listeners
            addCursorHover();
        }

        // Initial load
        renderProjects();

        // Lazy loading on scroll
        let isLoading = false;
        window.addEventListener('scroll', () => {
            if (isLoading) return;
            
            const scrollPosition = window.innerHeight + window.scrollY;
            const threshold = document.body.offsetHeight - 500;
            
            if (scrollPosition >= threshold && loadedProjects < projects.length) {
                isLoading = true;
                setTimeout(() => {
                    renderProjects();
                    isLoading = false;
                }, 500);
            }
        });

        // ============================================
        // PROJECT MODAL LOGIC
        // ============================================
        const modal = document.getElementById('project-modal');
        const modalContent = document.getElementById('modal-content');
        const closeBtn = document.getElementById('close-modal');
        const homeLink = document.getElementById('home-link');

        function openProject(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            
            modalContent.innerHTML = `
                <div class="project-header">
                    <h1 class="project-title">${project.title}</h1>
                    <div class="project-meta">${project.year} — ${project.location}</div>
                    <p class="project-description">${project.description}</p>
                </div>
                <div class="project-images">
                    ${project.images.map(img => `<img src="${img}" alt="${project.title}">`).join('')}
                </div>
            `;
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeProject() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        closeBtn.addEventListener('click', closeProject);
        homeLink.addEventListener('click', (e) => {
            e.preventDefault();
            closeProject();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Close modal on ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeProject();
        });
    </script>
