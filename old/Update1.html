<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louis Baurmann - Portfolio</title>
    
    <!-- Geist Mono Font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           RESET & BASE STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Roboto Mono', 'Courier New', monospace;
            background: #F5EEDC;
            color: #000000;
            cursor: none; /* Hide default cursor */
            overflow-x: hidden;
        }

        /* ============================================
           CUSTOM CURSOR WITH INVERT EFFECT
           ============================================ */
    
        .cursor {
            width: 60px;
            height: 60px;
            border: 2px solid #000;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease, border-width 0.3s ease;
            mix-blend-mode: difference; /* Color inversion effect */
            background: #fff; /* White for difference blend */
        }

        /* Cursor hover state - expand */
        .cursor.hover {
            width: 80px;
            height: 80px;
            border-width: 3px;
        }

        /* ============================================
           HEADER / NAVIGATION
           ============================================ */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(245, 238, 220, 0.95);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-decoration: none;
            color: #000;
            cursor: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .info-link,
        .instagram-link {
            font-size: 0.9rem;
            text-decoration: none;
            color: #000;
            cursor: none;
            transition: opacity 0.3s ease;
        }

        .info-link:hover,
        .instagram-link:hover {
            opacity: 0.6;
        }

        .instagram-icon {
            width: 20px;
            height: 20px;
        }

        /* ============================================
           PORTFOLIO HEADER
           ============================================ */
        .portfolio-header {
            padding-top: 120px;
            text-align: center;
            margin-bottom: 4rem;
        }

        .portfolio-header h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 6rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: #000;
        }

        /* ============================================
           MAIN CONTENT
           ============================================ */
        main {
            padding-top: 0;
            padding-left: 3rem;
            padding-right: 3rem;
            padding-bottom: 5rem;
        }

        /* ============================================
           MASONRY GRID LAYOUT
           ============================================ */
        .masonry-grid {
            column-count: 3;
            column-gap: 2rem;
        }

        .grid-item {
            break-inside: avoid;
            margin-bottom: 2rem;
            cursor: none;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInItem 0.6s ease forwards;
        }

        @keyframes fadeInItem {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .grid-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .grid-item:hover img {
            transform: scale(1.02);
            filter: brightness(0.95);
        }

        .grid-item figcaption {
            font-size: 0.85rem;
            margin-top: 0.5rem;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        /* ============================================
           PROJECT MODAL / PAGE
           ============================================ */
        .project-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #F5EEDC;
            z-index: 2000;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .project-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .project-content {
            padding: 120px 3rem 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .project-header {
            margin-bottom: 3rem;
        }

        .project-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 3rem;
            font-weight: 500;
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
        }

        .project-meta {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1rem;
        }

        .project-description {
            font-size: 1rem;
            line-height: 1.8;
            max-width: 700px;
            margin-bottom: 3rem;
        }

        .project-images {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .project-images img {
            width: 100%;
            height: auto;
        }

        .close-project {
            position: fixed;
            top: 2rem;
            right: 3rem;
            font-size: 2rem;
            background: none;
            border: none;
            cursor: none;
            z-index: 2001;
            font-family: 'Roboto Mono', monospace;
            color: #000;
            transition: opacity 0.3s ease;
        }

        .close-project:hover {
            opacity: 0.6;
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 1024px) {
            .masonry-grid {
                column-count: 2;
            }
        }

        @media (max-width: 768px) {
            body {
                cursor: auto;
            }

            .cursor,
            .cursor-trail {
                display: none;
            }

            .masonry-grid {
                column-count: 1;
            }

            header {
                padding: 1.5rem 2rem;
            }

            .portfolio-header h1 {
                font-size: 3rem;
            }

            main,
            .project-content {
                padding-left: 2rem;
                padding-right: 2rem;
            }

            .project-title {
                font-size: 2rem;
            }

            .close-project {
                right: 2rem;
            }
        }

        /* ============================================
           LOADING ANIMATION
           ============================================ */
        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 0.9rem;
            opacity: 0.5;
        }
    </style>
</head>
